version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: cat_postgres
    restart: always
    environment:
      POSTGRES_DB: cat_copilot
      POSTGRES_USER: cat_admin
      POSTGRES_PASSWORD: cat_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat_admin -d cat_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cat_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cat_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cat_admin:cat_password_2026@postgres:5432/cat_copilot
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ACCUWEATHER_API_KEY=${ACCUWEATHER_API_KEY:-MOCK_KEY}
      - SIMULATOR_TICK_SECONDS=2.0
      - SIMULATOR_ENABLED=true
    volumes:
      - ./backend/manuals:/app/manuals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cat_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
